<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Library | Mitti &amp; Steel</title>
<meta name="description" content="Everyday Indian habits, each rated Well supported, Some evidence, or Tradition not yet proven.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<div class="page-head"><div class="wrap">
  <span class="eyebrow">The Habit Library</span>
  <h1>Every habit, checked.</h1>
  <p class="lead">Every habit gets one honest label: Well supported, Some evidence, or Tradition, not yet proven. A habit gets its label only after we have opened and read the sources. Until then it is marked in fact-check.</p>
</div></div>
<section><div class="wrap" id="lib"></div></section>
</main>
<footer id="site-footer"></footer>
<script>
var groups = {
  "Kitchen and table": ["Clay pot water","The steel thali","Eating with your hands","Eating slowly, without screens","Ghee in moderation","Cooking in an iron kadhai","Curd and chaas","Soaked and fermented foods","Haldi milk","After-meal spices (saunf, jeera, ajwain)","Tulsi and ginger tea","Copper vessel water","Seasonal eating"],
  "Body and movement": ["Barefoot morning walks","Morning sunlight","Walking after meals","Floor sitting","A simple yoga sequence","Surya namaskar","Slow breathing","Sesame oil massage","Tongue scraping and oil pulling"],
  "Daily rhythm": ["Early dinners","Winding down and early sleep"]
};
var labels = {
  "Clay pot water": "Well supported (cooling)",
  "The steel thali": "A practical choice",
  "Eating with your hands": "Tradition, not yet proven",
  "Eating slowly, without screens": "Some evidence",
  "Ghee in moderation": "Some evidence",
  "Barefoot morning walks": "Some evidence",
  "Morning sunlight": "Some evidence",
  "Walking after meals": "Well supported (short term)",
  "Floor sitting": "Some evidence",
  "Cooking in an iron kadhai": "Some evidence",
  "Curd and chaas": "Well supported (lactose)",
  "Haldi milk": "Tradition, not yet proven",
  "Tulsi and ginger tea": "Some evidence (ginger)",
  "Slow breathing": "Some evidence"
};
var out = "";
Object.keys(groups).forEach(function (g) {
  out += "<div class='hgroup'><h2>" + g + "</h2><ul class='hlist'>";
  groups[g].forEach(function (h) {
    out += "<li><span>" + h + "</span><span class='st'>" + (labels[h] || "In fact-check") + "</span></li>";
  });
  out += "</ul></div>";
});
document.getElementById("lib").innerHTML = out;
</script>
<script src="script.js"></script>
</body>
</html>
